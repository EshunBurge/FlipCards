<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FlipCards</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <section class="card-deck-section">

      <div class="deck-heading">
        <p class="deck-eyebrow">CHOOSE YOUR SUIT</p>
        <h1>Explore My Deck</h1>
        <p class="deck-subtitle">
          A collection of my work, projects, and interests.
        </p>
      </div>

      <div class="card-deck">

        <!-- SOFTWARE DESIGN -->
        <a
          class="playing-card"
          href="#software"
          aria-label="Software Design"
        >
          <div class="card-inner">

            <div class="card-face card-back">
              <img
                src="cards-back.png"
                alt=""
              >
            </div>

            <div class="card-face card-front">
              <img
                src="cards-software.png"
                alt="Software Design card"
              >
            </div>

          </div>
        </a>


        <!-- GRAPHIC DESIGN -->
        <a
          class="playing-card"
          href="#graphic-design"
          aria-label="Graphic Design"
        >
          <div class="card-inner">

            <div class="card-face card-back">
              <img
                src="cards-back.png"
                alt=""
              >
            </div>

            <div class="card-face card-front">
              <img
                src="cards-graphic-design.png"
                alt="Graphic Design card"
              >
            </div>

          </div>
        </a>


        <!-- SCIENCE -->
        <a
          class="playing-card"
          href="#science"
          aria-label="Science Projects"
        >
          <div class="card-inner">

            <div class="card-face card-back">
              <img
                src="cards-back.png"
                alt=""
              >
            </div>

            <div class="card-face card-front">
              <img
                src="cards-science.png"
                alt="Science Projects card"
              >
            </div>

          </div>
        </a>


        <!-- FUN -->
        <a
          class="playing-card"
          href="#fun"
          aria-label="Just for Fun"
        >
          <div class="card-inner">

            <div class="card-face card-back">
              <img
                src="cards-back.png"
                alt=""
              >
            </div>

            <div class="card-face card-front">
              <img
                src="cards-fun.png"
                alt="Just for Fun card"
              >
            </div>

          </div>
        </a>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
